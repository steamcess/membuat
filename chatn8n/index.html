<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fafaf9">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <title>Chat n8n</title>
</head>
<body>
  <main class="chat">
    <header>
      <div><h1>Chat n8n</h1><p>Asisten pribadi</p></div>
      <button id="new-chat" class="secondary" type="button">Chat baru</button>
    </header>

    <section id="messages" role="log" aria-label="Percakapan" aria-live="polite" aria-relevant="additions text">
      <div id="welcome" class="welcome">
        <h2>Ada yang ingin ditanyakan?</h2>
        <p>Kirim pesan untuk mulai ngobrol dengan AI di n8n.</p>
      </div>
    </section>

    <footer>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="error" role="alert" hidden></p>
      <form id="chat-form">
        <label class="sr-only" for="message">Pesan</label>
        <textarea id="message" name="message" rows="1" maxlength="8000" placeholder="Tulis pesan…" required></textarea>
        <button id="send" type="submit">Kirim</button>
      </form>
      <small>Memori mengikuti sesi ini. Jawaban AI bisa keliru.</small>
    </footer>
  </main>
</body>
</html>
